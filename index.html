<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#00000000"/>
  <title>Fluid Mobile UI</title>

  <!-- Web Manifest for pure native standalone launcher fullscreen -->
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22FluidUI%22,
    %22short_name%22:%22FluidUI%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%2308090c%22,
    %22theme_color%22:%22%2308090c%22
  }">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent !important;
      touch-action: manipulation;
      border-radius: 0px !important;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      background-color: #08090c;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    .viewport {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background: #0d0e12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .viewport {
        max-width: 100vw;
      }
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      background: linear-gradient(150deg, #070c1e 0%, #171530 45%, #230d22 100%);
      z-index: 1;
    }

    /* Status Bar */
    .status-bar {
      height: calc(36px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: 20px;
      padding-right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      background: transparent;
    }

    .home-screen {
      position: relative;
      z-index: 10;
      flex: 1;
      padding: 36px 24px calc(40px + env(safe-area-inset-bottom, 0px)) 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px 20px;
      align-content: start;
    }

    /* Enhanced Touch Targets */
    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      touch-action: none;
    }

    .app-icon:active {
      transform: scale(0.85);
      opacity: 0.7;
    }

    .icon-box {
      width: 64px;
      height: 64px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .app-label {
      color: #f8fafc;
      font-size: 11px;
      font-weight: 500;
      margin-top: 8px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Slow & Fluid App Launching Animation */
    .app-container {
      position: absolute;
      inset: 0;
      background: #111218;
      z-index: 40;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.25);
      transform-origin: center center !important;
      /* Slow, fluid spring transition timing */
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.45s ease-out,
                  visibility 0.65s ease;
      will-change: transform, opacity;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .app-container.open {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .app-header {
      padding: 30px 24px 16px 24px;
      background: #161822;
      border-bottom: 1px solid #232636;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .settings-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px calc(60px + env(safe-area-inset-bottom, 0px)) 20px;
    }

    .settings-group {
      background: #181a24;
      border: 1px solid #2a2e3f;
      margin-bottom: 24px;
    }

    .setting-row {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202330;
      transition: background-color 0.2s ease;
    }

    .setting-row:active {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .toggle {
      width: 44px;
      height: 24px;
      background: #334155;
      position: relative;
      cursor: pointer;
      transition: background 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toggle.active {
      background: #4f46e5;
    }

    .toggle-knob {
      width: 18px;
      height: 18px;
      background: #ffffff;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toggle.active .toggle-knob {
      transform: translateX(20px);
    }

    /* Interactive Swipe Home Bar */
    .home-indicator-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(44px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      cursor: pointer;
      touch-action: none;
    }

    .home-indicator-line {
      width: 140px;
      height: 5px;
      background-color: rgba(255, 255, 255, 0.7);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .home-indicator-area:active .home-indicator-line {
      transform: scaleX(1.1);
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="viewport" id="viewport">
    
    <div class="wallpaper"></div>

    <div class="status-bar">
      <span id="systemClock">12:00</span>
      <span class="text-[10px] tracking-wider text-indigo-400 font-bold uppercase">Fluid Engine</span>
    </div>

    <div class="home-screen">
      <div class="app-icon" id="settingsIcon">
        <div class="icon-box" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">
          <svg class="w-8 h-8 fill-white" viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
          </svg>
        </div>
        <span class="app-label">Settings</span>
      </div>
    </div>

    <!-- App View Container -->
    <div class="app-container" id="settingsApp">
      <div class="app-header">
        <div>
          <span class="text-xs uppercase tracking-wider text-indigo-400 font-bold block mb-1">System Application</span>
          <h1 class="text-2xl font-bold text-slate-100">Settings</h1>
        </div>
      </div>

      <div class="settings-content">
        <div class="settings-group">
          <div class="setting-row">
            <span class="text-sm text-slate-200">Fluid Mode</span>
            <div class="toggle active" onclick="this.classList.toggle('active')">
              <div class="toggle-knob"></div>
            </div>
          </div>
          <div class="setting-row">
            <span class="text-sm text-slate-200">Haptic Tap Feedback</span>
            <div class="toggle active" onclick="this.classList.toggle('active')">
              <div class="toggle-knob"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="home-indicator-area" id="indicatorArea">
      <div class="home-indicator-line"></div>
    </div>

  </div>

  <script>
    // 1. Fullscreen Engine - Auto Trigger on First Touch
    function triggerAutoFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
      // Remove listener once triggered
      window.removeEventListener('touchstart', triggerAutoFullscreen);
      window.removeEventListener('pointerdown', triggerAutoFullscreen);
      window.removeEventListener('click', triggerAutoFullscreen);
    }
    window.addEventListener('touchstart', triggerAutoFullscreen, { passive: true });
    window.addEventListener('pointerdown', triggerAutoFullscreen, { passive: true });
    window.addEventListener('click', triggerAutoFullscreen, { passive: true });

    // 2. System Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('systemClock').textContent = 
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 3. Fluid App Launch Controller
    const settingsIcon = document.getElementById('settingsIcon');
    const settingsApp = document.getElementById('settingsApp');
    let activeApp = null;

    function openApp(app, sourceEvent) {
      if (!app) return;
      activeApp = app;
      
      // Explicitly center animation origin to screen center
      app.style.transformOrigin = 'center center';
      
      app.classList.add('open');
    }

    function closeApp(app) {
      if (!app) return;
      app.classList.remove('open');
      activeApp = null;
    }

    // Touch optimization for zero latency opening
    settingsIcon.addEventListener('pointerdown', (e) => openApp(settingsApp, e));

    // 4. Ultra-Fast Swipe Home Gesture Engine
    const indicatorArea = document.getElementById('indicatorArea');
    let startY = 0;

    indicatorArea.addEventListener('touchstart', (e) => {
      if (!activeApp) return;
      startY = e.touches[0].clientY;
    }, { passive: true });

    indicatorArea.addEventListener('touchend', (e) => {
      if (!activeApp) return;
      let endY = e.changedTouches[0].clientY;
      if (startY - endY > 20) { // High sensitivity swipe
        closeApp(activeApp);
      }
    });

    indicatorArea.addEventListener('click', () => {
      if (activeApp) closeApp(activeApp);
    });
  </script>
</body>
</html>
