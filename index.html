<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>RunUI Emulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      /* Enforce strict flat edges without rounded corners */
      border-radius: 0px !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #08090c;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background: #0d0e12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      background: linear-gradient(150deg, #070c1e 0%, #171530 45%, #230d22 100%);
      z-index: 1;
    }

    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 10%;
      pointer-events: none;
      z-index: 2;
    }

    .status-bar {
      height: calc(36px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: 20px;
      padding-right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      z-index: 50;
      background: rgba(10, 11, 16, 0.4);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .home-screen {
      position: relative;
      z-index: 10;
      flex: 1;
      padding: 36px 24px calc(40px + env(safe-area-inset-bottom, 0px)) 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      grid-auto-rows: max-content;
      gap: 28px 20px;
      align-content: start;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .app-icon:active {
      transform: scale(0.92);
      opacity: 0.85;
    }

    .icon-box {
      width: 64px;
      height: 64px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .app-label {
      color: #f8fafc;
      font-size: 11px;
      font-weight: 500;
      margin-top: 8px;
      text-align: center;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .app-container {
      position: absolute;
      inset: 0;
      background: #111218;
      z-index: 40;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(100%);
      /* Ultra smooth cubic curve without bounce */
      transition: transform 0.26s cubic-bezier(0.2, 0.8, 0.25, 1),
                  opacity 0.22s linear,
                  visibility 0.26s linear;
      will-change: transform, opacity;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .app-container.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0%);
    }

    .app-header {
      padding: 30px 24px 16px 24px;
      background: #161822;
      border-bottom: 1px solid #232636;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .settings-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px calc(60px + env(safe-area-inset-bottom, 0px)) 20px;
    }

    .settings-group {
      background: #181a24;
      border: 1px solid #2a2e3f;
      margin-bottom: 24px;
    }

    .group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin: 0 0 8px 4px;
    }

    .setting-row {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202330;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .setting-icon {
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .setting-text {
      font-size: 14px;
      font-weight: 500;
      color: #e2e8f0;
    }

    .setting-value {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Toggle switch widget */
    .toggle {
      width: 44px;
      height: 24px;
      background: #334155;
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .toggle.active {
      background: #4f46e5;
    }

    .toggle-knob {
      width: 18px;
      height: 18px;
      background: #ffffff;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toggle.active .toggle-knob {
      transform: translateX(20px);
    }

    .home-indicator-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(36px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      cursor: grab;
      touch-action: none;
    }

    .home-indicator-area:active {
      cursor: grabbing;
    }

    .home-indicator-line {
      width: 140px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.75);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .home-indicator-area:hover .home-indicator-line {
      background-color: rgba(255, 255, 255, 0.95);
    }

    .app-container.dragging {
      transition: none !important;
    }
  </style>
</head>
<body>

  <div class="viewport" id="viewport">
    
    <div class="wallpaper"></div>
    <div class="bg-glow"></div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="systemClock">12:00</span>
      <div class="flex items-center gap-2">
        <span class="text-[10px] tracking-wider text-indigo-400 font-bold uppercase">RunUI</span>
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.3c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.57 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
        </svg>
      </div>
    </div>

    <div class="home-screen">
      <!-- Settings App Icon -->
      <div class="app-icon" id="settingsIcon" onclick="openApp('settingsApp')">
        <div class="icon-box" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">
          <svg class="w-8 h-8 fill-white" viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
          </svg>
        </div>
        <span class="app-label">Settings</span>
      </div>

      <!-- Additional Applications -->
      <div class="app-icon" onclick="showNotice('Files app coming soon!')">
        <div class="icon-box" style="background: linear-gradient(135deg, #10b981, #047857);">
          <svg class="w-8 h-8 fill-white" viewBox="0 0 24 24">
            <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
          </svg>
        </div>
        <span class="app-label">Files</span>
      </div>

      <div class="app-icon" onclick="showNotice('Terminal coming soon!')">
        <div class="icon-box" style="background: linear-gradient(135deg, #64748b, #334155);">
          <svg class="w-8 h-8 fill-white" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zm-14-9l4 4-4 4 1.41 1.41L12.83 13l-5.42-5.41L6 9zm6 7h6v2h-6z"/>
          </svg>
        </div>
        <span class="app-label">Terminal</span>
      </div>
    </div>

    <div class="app-container" id="settingsApp">
      <div class="app-header">
        <div>
          <span class="text-xs uppercase tracking-wider text-indigo-400 font-bold block mb-1">System Application</span>
          <h1 class="app-title">Settings</h1>
        </div>
        <span class="text-xs text-slate-500 font-mono">v1.0.4</span>
      </div>

      <div class="settings-content">
        <p class="group-title">Connectivity</p>
        <div class="settings-group">
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-icon bg-indigo-600">
                <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.8c3.67 0 7.02 1.38 9.58 3.65L12 20.3 2.42 11.45C4.98 9.18 8.33 7.8 12 7.8z"/></svg>
              </div>
              <span class="setting-text">Wi-Fi Network</span>
            </div>
            <span class="setting-value">RunUI-HyperNet</span>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-icon bg-blue-600">
                <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
              </div>
              <span class="setting-text">Bluetooth</span>
            </div>
            <div class="toggle active" onclick="toggleSwitch(this)">
              <div class="toggle-knob"></div>
            </div>
          </div>
        </div>

        <p class="group-title">Preferences</p>
        <div class="settings-group">
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-icon bg-amber-600">
                <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
              </div>
              <span class="setting-text">Dark Theme</span>
            </div>
            <div class="toggle active" onclick="toggleSwitch(this)">
              <div class="toggle-knob"></div>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-icon bg-purple-600">
                <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
              </div>
              <span class="setting-text">Notifications</span>
            </div>
            <div class="toggle" onclick="toggleSwitch(this)">
              <div class="toggle-knob"></div>
            </div>
          </div>
        </div>

        <p class="group-title">System</p>
        <div class="settings-group">
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-icon bg-emerald-600">
                <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
              </div>
              <span class="setting-text">About RunUI</span>
            </div>
            <span class="setting-value">v1.0.0-fullscreen</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Swipe Indicator Line -->
    <div class="home-indicator-area" id="indicatorArea">
      <div class="home-indicator-line"></div>
    </div>

  </div>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('systemClock').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleSwitch(element) {
      element.classList.toggle('active');
    }

    function showNotice(msg) {
      const alertBox = document.createElement('div');
      alertBox.className = 'absolute top-12 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-100 px-4 py-2 text-xs border border-slate-700 shadow-xl z-50 transition-all';
      alertBox.textContent = msg;
      document.getElementById('viewport').appendChild(alertBox);
      setTimeout(() => alertBox.remove(), 2000);
    }

    let activeApp = null;

    function openApp(appId) {
      const app = document.getElementById(appId);
      if (app) {
        activeApp = app;
        app.style.transform = '';
        app.classList.add('open');
      }
    }

    function closeApp(app) {
      if (!app) return;
      app.classList.remove('open');
      app.style.transform = '';
      activeApp = null;
    }

    const indicatorArea = document.getElementById('indicatorArea');

    let startY = 0;
    let currentY = 0;
    let isDragging = false;
    const swipeThreshold = 50;

    // Touch Event Handlers
    indicatorArea.addEventListener('touchstart', (e) => {
      if (!activeApp) return;
      startY = e.touches[0].clientY;
      currentY = startY;
      isDragging = true;
      activeApp.classList.add('dragging');
    }, { passive: true });

    indicatorArea.addEventListener('touchmove', (e) => {
      if (!isDragging || !activeApp) return;
      currentY = e.touches[0].clientY;
      let deltaY = startY - currentY;

      if (deltaY > 0) {
        let percentage = (deltaY / window.innerHeight) * 100;
        activeApp.style.transform = `translateY(-${percentage}%)`;
      }
    }, { passive: true });

    indicatorArea.addEventListener('touchend', () => {
      if (!isDragging || !activeApp) return;
      isDragging = false;
      activeApp.classList.remove('dragging');

      let deltaY = startY - currentY;
      if (deltaY > swipeThreshold) {
        closeApp(activeApp);
      } else {
        activeApp.style.transform = 'translateY(0%)';
      }
    });

    // Mouse Event Handlers for Desktop Testing
    indicatorArea.addEventListener('mousedown', (e) => {
      if (!activeApp) return;
      startY = e.clientY;
      currentY = startY;
      isDragging = true;
      activeApp.classList.add('dragging');

      const onMouseMove = (moveEvent) => {
        if (!isDragging || !activeApp) return;
        currentY = moveEvent.clientY;
        let deltaY = startY - currentY;
        if (deltaY > 0) {
          let percentage = (deltaY / activeApp.offsetHeight) * 100;
          activeApp.style.transform = `translateY(-${percentage}%)`;
        }
      };

      const onMouseUp = () => {
        if (isDragging && activeApp) {
          isDragging = false;
          activeApp.classList.remove('dragging');
          let deltaY = startY - currentY;
          if (deltaY > swipeThreshold) {
            closeApp(activeApp);
          } else {
            activeApp.style.transform = 'translateY(0%)';
          }
        }
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      };

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });
  </script>
</body>
</html>
